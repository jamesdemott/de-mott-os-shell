<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>De Mott OS</title>
<link rel="icon" href="favicon.svg?v=3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F3EB" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#15130F" media="(prefers-color-scheme:dark)">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/list.css">
</head>
<body>
<button class="themebtn" id="themebtn" type="button">theme</button>
<div class="wrap">
  <header class="home">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="pagetitle"></h1>
    <p class="sub" id="pagesub"></p>
    <div class="statrow" id="statrow"></div>
  </header>
  <nav class="nav" id="nav"></nav>
  <div id="boot"></div>

  <section id="s-tracks" hidden>
    <div class="shead"><h2 id="trackhead">Tracker</h2>
      <p class="note" id="tracknote"></p></div>
    <div class="tscroll"><table class="tracks" id="tracks"></table></div>
    <button class="mini" id="trackadd" type="button">+ add a row</button>
  </section>

  <form class="capture" id="capform" autocomplete="off">
    <span class="capplus">+</span>
    <input id="capinput" type="text" spellcheck="false" placeholder="">
    <button type="submit" id="capbtn">add</button>
    <div class="cappreview" id="cappreview"></div>
  </form>

  <div class="projbar" id="projbar" hidden></div>

  <div id="groups"></div>

  <section id="s-board" hidden>
    <div class="shead"><h2>Synced board</h2>
      <p class="note" id="boardnote"></p></div>
    <div id="board"></div>
  </section>

  <section id="s-archived" hidden>
    <div class="shead"><h2 id="archhead">Archived</h2>
      <p class="note">Out of the way but not gone. Unarchive from the row editor.</p></div>
    <div class="lgroup" id="archlist"></div>
  </section>

  <section id="s-done" hidden>
    <div class="shead"><h2 id="donehead">Done</h2>
      <p class="note">Ticked off. Untick to bring one back.</p></div>
    <div class="lgroup" id="donelist"></div>
  </section>

  <footer class="rebuild" id="rebuild"></footer>
</div>
<div class="toast" id="toast" hidden></div>
<script src="js/util.js"></script>
<script src="js/outbox.js"></script>
<script src="js/theme.js"></script>
<script src="js/nav.js"></script>
<script src="js/capture.js"></script>
<script src="js/rows.js"></script>
<script src="js/list.js"></script>
</body>
</html>
